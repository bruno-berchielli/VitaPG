production: &recurring
  prune_backups:
    class: PruneBackupsJob
    queue: backups
    schedule: at 4am every day
  check_missed_runs:
    class: CheckMissedRunsJob
    queue: backups
    schedule: every hour
  recover_interrupted_runs:
    class: RecoverInterruptedRunsJob
    queue: backups
    schedule: every 15 minutes

development: *recurring
